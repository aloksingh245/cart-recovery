[project]
name = "cart-recovery"
version = "1.0.0"
description = "Consent-aware abandoned-cart recovery end-to-end synthetic operations application"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
recovery = "cart_recovery.cli:main"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
