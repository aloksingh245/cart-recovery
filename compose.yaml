services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: recovery
      POSTGRES_PASSWORD: recovery_local
      POSTGRES_DB: recovery
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - recovery_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery -d recovery"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://recovery:recovery_local@db:5432/recovery
      DEMO_PASSWORD: ${DEMO_PASSWORD:-recovery-demo}
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - recovery_exports:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 30
  worker:
    build: .
    command: ["uv", "run", "recovery", "worker"]
    environment:
      DATABASE_URL: postgresql://recovery:recovery_local@db:5432/recovery
    depends_on:
      app:
        condition: service_healthy
volumes:
  recovery_db:
  recovery_exports:
